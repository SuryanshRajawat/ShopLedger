<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the browser UI, Express server, routers, library modules, configuration and JSON data store, with numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
      .head{font-size:15px;font-weight:700}.label{font-size:13px}.small{font-size:12px;fill:#475569}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .focus{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.flow{fill:none;stroke:#2563eb;stroke-width:2.3;marker-end:url(#flowArrow)}
      .edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="32" y="42" class="title">ShopLedger · application architecture</text>
  <text x="32" y="66" class="subtitle">Node / Express POS · Khata credit ledger · GST invoicing · local JSON persistence</text>

  <!-- Browser UI -->
  <rect x="30" y="105" width="210" height="139" rx="10" class="box"/>
  <text x="48" y="132" class="head">Browser UI</text>
  <text x="48" y="157" class="label">public/</text>
  <text x="48" y="179" class="small">index.html · js/app.js</text>
  <text x="48" y="199" class="small">css/style.css</text>
  <text x="48" y="224" class="small">Catalog · cart · Khata · reports</text>

  <!-- Server -->
  <rect x="292" y="105" width="205" height="139" rx="10" class="box"/>
  <text x="313" y="132" class="head">Express application</text>
  <text x="313" y="158" class="label">server.js</text>
  <text x="313" y="181" class="small">Serves public/ and JSON APIs</text>
  <text x="313" y="202" class="small">GET /orders/:id/invoice</text>
  <text x="313" y="224" class="small">invoice.render()</text>
  <path d="M240 173H292" class="edge"/>
  <text x="246" y="162" class="small">HTTP</text>

  <!-- Routers -->
  <rect x="545" y="95" width="280" height="242" rx="10" class="group"/>
  <text x="565" y="121" class="head">routes/ · mounted at /api</text>
  <rect x="565" y="137" width="240" height="39" rx="6" class="box"/>
  <text x="579" y="162" class="label">products.js · products, coupons</text>
  <rect x="565" y="184" width="240" height="47" rx="6" class="box"/>
  <text x="579" y="204" class="label">orders.js · list, get, create, cancel</text>
  <text x="579" y="222" class="small">POST /orders is numbered flow 1–7</text>
  <rect x="565" y="239" width="240" height="39" rx="6" class="box"/>
  <text x="579" y="264" class="label">customers.js · customers, settle</text>
  <rect x="565" y="286" width="240" height="39" rx="6" class="box"/>
  <text x="579" y="311" class="label">reports.js · dashboard, preview, export</text>
  <path d="M497 173H545" class="edge"/>

  <!-- Library modules -->
  <rect x="865" y="95" width="305" height="447" rx="10" class="group"/>
  <text x="885" y="121" class="head">lib/ · business logic</text>
  <rect x="885" y="137" width="125" height="41" rx="6" class="box"/>
  <text x="897" y="163" class="label">pricing.js</text>
  <rect x="1024" y="137" width="126" height="41" rx="6" class="box"/>
  <text x="1037" y="163" class="label">coupons.js</text>
  <rect x="885" y="188" width="125" height="41" rx="6" class="box"/>
  <text x="897" y="214" class="label">inventory.js</text>
  <rect x="1024" y="188" width="126" height="41" rx="6" class="box"/>
  <text x="1037" y="214" class="label">tax.js</text>
  <rect x="885" y="239" width="125" height="41" rx="6" class="box"/>
  <text x="897" y="265" class="label">orders.js</text>
  <rect x="1024" y="239" width="126" height="41" rx="6" class="box"/>
  <text x="1037" y="265" class="label">ledger.js</text>
  <rect x="885" y="290" width="125" height="41" rx="6" class="box"/>
  <text x="897" y="316" class="label">store.js</text>
  <rect x="1024" y="290" width="126" height="41" rx="6" class="box"/>
  <text x="1037" y="316" class="label">dates.js</text>
  <rect x="885" y="341" width="265" height="55" rx="6" class="focus"/>
  <text x="901" y="365" class="label" style="font-weight:700;fill:#9f1239">invoice.js · render / computeInvoiceFigures</text>
  <text x="901" y="385" class="small">Printable HTML invoice and recomputed figures</text>
  <rect x="885" y="406" width="265" height="47" rx="6" class="box"/>
  <text x="901" y="426" class="label">reports.js</text>
  <text x="901" y="445" class="small">dashboard and invoice reconciliation</text>
  <path d="M825 214H865" class="edge"/>
  <path d="M825 305H865" class="edge"/>
  <!-- Pricing depends on tax.js and coupons.js; invoice.js currently reads config directly. -->
  <path d="M1010 157H1024" class="edge"/>
  <path d="M947 178V188" class="edge"/>

  <!-- Config/data -->
  <rect x="292" y="279" width="205" height="76" rx="9" class="box"/>
  <text x="313" y="307" class="head">config.js</text>
  <text x="313" y="331" class="small">shop · tax slabs · coupons</text>
  <rect x="292" y="390" width="205" height="82" rx="9" class="box"/>
  <text x="313" y="419" class="head">data/db.json</text>
  <text x="313" y="443" class="small">Products · customers · orders</text>
  <text x="313" y="461" class="small">settlements · audit log</text>
  <path d="M497 317H535V358H865" class="edge dash"/>
  <text x="597" y="352" class="small">configuration</text>
  <path d="M497 430H850V311H885" class="edge"/>
  <text x="620" y="423" class="small">store.read() / store.write()</text>

  <!-- Flow panel -->
  <rect x="30" y="510" width="1140" height="255" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="52" y="540" class="head" style="fill:#1d4ed8">Order placement · POST /api/orders</text>
  <text x="52" y="561" class="small">Numbered path follows routes/orders.js and lib calls; flow 7 writes the updated JSON store.</text>
  <g>
    <rect x="52" y="584" width="244" height="66" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="74" cy="606" r="13" fill="#2563eb"/><text x="70" y="611" style="font-size:13px;font-weight:700;fill:white">1</text>
    <text x="96" y="609" class="label" style="font-weight:700">Browser submits cart</text>
    <text x="96" y="632" class="small">public/js/app.js → POST</text>

    <rect x="330" y="584" width="244" height="66" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="352" cy="606" r="13" fill="#2563eb"/><text x="348" y="611" style="font-size:13px;font-weight:700;fill:white">2</text>
    <text x="374" y="609" class="label" style="font-weight:700">Resolve and validate</text>
    <text x="374" y="632" class="small">inventory.find() · inventory.check()</text>
    <path d="M296 617H330" class="flow"/>

    <rect x="608" y="584" width="244" height="66" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="630" cy="606" r="13" fill="#2563eb"/><text x="626" y="611" style="font-size:13px;font-weight:700;fill:white">3</text>
    <text x="652" y="609" class="label" style="font-weight:700">Price &amp; coupon</text>
    <text x="652" y="632" class="small">coupons.validate() · pricing.computeTotals()</text>
    <path d="M574 617H608" class="flow"/>

    <rect x="886" y="584" width="244" height="66" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="908" cy="606" r="13" fill="#2563eb"/><text x="904" y="611" style="font-size:13px;font-weight:700;fill:white">4</text>
    <text x="930" y="609" class="label" style="font-weight:700">Charge Khata (if selected)</text>
    <text x="930" y="632" class="small">ledger.chargeOrderToKhata()</text>
    <path d="M852 617H886" class="flow"/>

    <rect x="190" y="676" width="244" height="66" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="212" cy="698" r="13" fill="#2563eb"/><text x="208" y="703" style="font-size:13px;font-weight:700;fill:white">5</text>
    <text x="234" y="701" class="label" style="font-weight:700">Commit stock</text>
    <text x="234" y="724" class="small">inventory.reserve()</text>

    <rect x="478" y="676" width="244" height="66" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="500" cy="698" r="13" fill="#2563eb"/><text x="496" y="703" style="font-size:13px;font-weight:700;fill:white">6</text>
    <text x="522" y="701" class="label" style="font-weight:700">Create order + audit</text>
    <text x="522" y="724" class="small">orders.add() · store.appendAudit()</text>

    <rect x="766" y="676" width="244" height="66" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="788" cy="698" r="13" fill="#2563eb"/><text x="784" y="703" style="font-size:13px;font-weight:700;fill:white">7</text>
    <text x="810" y="701" class="label" style="font-weight:700">Persist and respond</text>
    <text x="810" y="724" class="small">store.write() → data/db.json</text>
    <path d="M1007 650V661H312V676" class="flow"/>
    <path d="M434 709H478" class="flow"/>
    <path d="M722 709H766" class="flow"/>
  </g>
  <!-- Legend -->
  <rect x="916" y="278" width="234" height="51" rx="7" fill="#fff" stroke="#cbd5e1"/>
  <rect x="929" y="294" width="18" height="18" rx="3" class="focus"/>
  <text x="957" y="308" class="small">Ticket focus: lib/invoice.js only</text>
</svg>
